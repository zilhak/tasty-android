name: CI

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image may not ship platform 37 and build-tools 37.0.0 yet.
      - name: Install Android SDK packages
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      # rust/rust-toolchain.toml pins the toolchain and Android targets; rustup installs them on first use.
      - name: Install Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      # Restored before the cargo installs below: the cache keeps the installed binaries, so a
      # warm run does not compile cargo-ndk again.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk 4.1.2 unless the Rust cache restored it
        working-directory: rust
        run: |
          want=4.1.2
          have=$(cargo ndk --version 2>/dev/null | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n 1 || true)
          if [ "$have" = "$want" ]; then
            echo "cargo-ndk $have restored from the Rust cache; not installing"
          else
            echo "cargo-ndk ${have:-missing}; installing $want"
            cargo install cargo-ndk --version "$want" --locked
          fi

      - name: Rust format, Clippy and tests
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      # Caches Gradle state and checks the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Android Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
