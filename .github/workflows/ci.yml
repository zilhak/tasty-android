name: CI

on:
  push:
    branches: [develop, release, main]
  pull_request:
    branches: [develop, release, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    # Measured: 18m02s for a run that found no Rust cache and installed cargo-ndk, cargo-deny and
    # cargo-about, and 2m53s for a run whose cache matched. The three tool versions are in the
    # cache key, so raising one brings one run without a cache.
    timeout-minutes: 30
    # Pinned cargo tool versions. They are also part of the Rust cache key below, so raising one
    # starts a new cache entry that saves the newly installed binary.
    env:
      TOOL_CARGO_NDK_VERSION: 4.1.2
      TOOL_CARGO_DENY_VERSION: 0.20.2
      TOOL_CARGO_ABOUT_VERSION: 0.9.3
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The runner image may not ship platform 37 and build-tools 37.0.0 yet.
      - name: Install Android SDK packages
        run: |
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;30.0.16248370"

      # rust/rust-toolchain.toml pins the toolchain and Android targets; rustup installs them on first use.
      - name: Install Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      # Restored before the cargo installs below: the cache keeps the installed binaries, so a
      # warm run does not compile cargo-ndk again. rust-cache leaves out of the cache any binary
      # that was in ~/.cargo/bin before this step, and skips the save on a full key match; the
      # tool versions in the key make a run that installs them end in a save.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: cargo-ndk-${{ env.TOOL_CARGO_NDK_VERSION }}-cargo-deny-${{ env.TOOL_CARGO_DENY_VERSION }}-cargo-about-${{ env.TOOL_CARGO_ABOUT_VERSION }}

      - name: Install cargo-ndk ${{ env.TOOL_CARGO_NDK_VERSION }} unless the Rust cache restored it
        working-directory: rust
        run: |
          want="$TOOL_CARGO_NDK_VERSION"
          # Skip only when the command succeeds and prints exactly "cargo-ndk $want"; a failed
          # command, another version or a pre-release counts as not installed.
          if have=$(cargo ndk --version 2>/dev/null) && [ "$have" = "cargo-ndk $want" ]; then
            echo "$have restored from the Rust cache; not installing"
          else
            echo "cargo-ndk $want not found (got: ${have:-nothing}); installing"
            cargo install cargo-ndk --version "$want" --locked
          fi

      - name: Install cargo-deny ${{ env.TOOL_CARGO_DENY_VERSION }} unless the Rust cache restored it
        working-directory: rust
        run: |
          want="$TOOL_CARGO_DENY_VERSION"
          # Skip only when the command succeeds and prints exactly "cargo-deny $want"; a failed
          # command, another version or a pre-release counts as not installed.
          if have=$(cargo deny --version 2>/dev/null) && [ "$have" = "cargo-deny $want" ]; then
            echo "$have restored from the Rust cache; not installing"
          else
            echo "cargo-deny $want not found (got: ${have:-nothing}); installing"
            cargo install cargo-deny --version "$want" --locked
          fi

      # cargo-about builds the Rust part of THIRD_PARTY_NOTICES.txt (scripts/notices.sh). Its binary
      # needs the cli feature.
      - name: Install cargo-about ${{ env.TOOL_CARGO_ABOUT_VERSION }} unless the Rust cache restored it
        working-directory: rust
        run: |
          want="$TOOL_CARGO_ABOUT_VERSION"
          # Skip only when the command succeeds and prints exactly "cargo-about $want"; a failed
          # command, another version or a pre-release counts as not installed.
          if have=$(cargo about --version 2>/dev/null) && [ "$have" = "cargo-about $want" ]; then
            echo "$have restored from the Rust cache; not installing"
          else
            echo "cargo-about $want not found (got: ${have:-nothing}); installing"
            cargo install cargo-about --version "$want" --locked --features cli
          fi

      - name: Rust format, Clippy and tests
        working-directory: rust
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      # The host Clippy above does not see cfg(target_os = "android") code. cargo-ndk supplies the
      # NDK clang that dependencies with C code need (cc today, ring once tasty-network brings it);
      # same NDK and API level as the cargoNdkBuild task.
      - name: Clippy for Android (aarch64-linux-android via cargo-ndk)
        working-directory: rust
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" \
            cargo ndk -t arm64-v8a -P 29 clippy --workspace --all-targets --locked -- -D warnings

      # Contract 4 of docs/plan/network-access-plan.md: in the release graph of the app cdylib, no
      # russh-config, no system-ssh on tasty-net-ssh, and no tokio "process" turned on through a
      # tasty-net crate. tasty-network publishes the check as one script; take it from the rev that
      # Cargo.lock pins. The release build (cargoNdkBuild) passes no feature arguments.
      - name: Mobile dependency check (system-ssh, both Android ABIs)
        working-directory: rust
        run: |
          revs=$(grep -oE 'git\+https://github\.com/zilhak/tasty-network\?rev=[0-9a-f]{40}' Cargo.lock | sed 's/.*rev=//' | sort -u || true)
          if [ "$(printf '%s\n' "$revs" | grep -c .)" -ne 1 ]; then
            echo "expected one tasty-network rev in Cargo.lock, got: ${revs:-none}" >&2
            exit 1
          fi
          script="$RUNNER_TEMP/check-mobile-deps.sh"
          curl -fsSL -o "$script" "https://raw.githubusercontent.com/zilhak/tasty-network/$revs/scripts/check-mobile-deps.sh"
          echo "check-mobile-deps.sh from tasty-network $revs"
          bash "$script" --manifest-path "$PWD/Cargo.toml" --app \
            --target aarch64-linux-android --target x86_64-linux-android \
            -p tasty-mobile-core

      # Policy in rust/deny.toml; the manifest path makes tasty-mobile-core the only graph root.
      - name: cargo deny (licenses, bans, sources)
        working-directory: rust
        run: cargo deny --locked --manifest-path tasty-mobile-core/Cargo.toml --config deny.toml check licenses bans sources

      # Caches Gradle state and checks the wrapper jar checksum.
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true

      # Builds the notice again from cargo-about, notices/ and the Gradle release runtime classpath,
      # and fails when it differs from the committed file. After setup-gradle because it runs Gradle.
      - name: License notice is up to date (THIRD_PARTY_NOTICES.txt)
        run: scripts/notices.sh check

      - name: Check formatting
        run: ./gradlew spotlessCheck

      - name: Android Lint (first Rust build, cargoNdkBuild and uniffiBindgen)
        run: ./gradlew lint

      - name: Unit tests (Rust outputs expected up to date)
        run: ./gradlew test

      - name: Build debug APK (Rust outputs expected up to date)
        run: ./gradlew assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore
