[package]
name = "tasty-mobile-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Rust core of the Tasty Android app, exposed to Kotlin through UniFFI"

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
uniffi.workspace = true
tasty-terminal.workspace = true
termwiz.workspace = true
tasty-net-identity.workspace = true
# renameat2 with RENAME_NOREPLACE for the peer key store (called as a raw syscall).
libc = "0.2.191"
