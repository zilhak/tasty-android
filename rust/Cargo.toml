[workspace]
resolver = "3"
members = ["tasty-mobile-core", "uniffi-bindgen"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
uniffi = "0.32"
# Shared with the desktop app. Pinned to a pushed commit of github.com/zilhak/tasty;
# bump the rev on purpose and keep Cargo.lock in step.
tasty-terminal = { git = "https://github.com/zilhak/tasty", rev = "e1e705bc49486612b39b38c7b3f91c4eba6ca9e9" }
termwiz = "0.22"
# Device key and device ID of the Tasty network. Pinned to a pushed develop commit of
# github.com/zilhak/tasty-network until it tags an Android release; bump the rev on purpose
# and keep Cargo.lock in step.
tasty-net-identity = { git = "https://github.com/zilhak/tasty-network", rev = "e656c21a18b3fcd75d3aadbf0817515b75dbb0ed" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
