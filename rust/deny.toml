# cargo deny policy for the licenses, bans and sources checks. Run from rust/:
#   cargo deny --locked --manifest-path tasty-mobile-core/Cargo.toml --config deny.toml check licenses bans sources
# The manifest path makes the app cdylib tasty-mobile-core the only root, so the host generator
# uniffi-bindgen is not in the graph. Started from the tasty-network deny.toml, with the license
# list narrowed to what this graph uses.
# Advisories are left out: a new advisory fails commits that changed nothing. Decide them as a
# separate job at the rev bump that brings in the external SSH dependencies.

[graph]
# The two Android ABIs that the app ships. Dev dependencies are not linked into the app.
# cargo-deny has no way to leave out build dependencies, so they are in the graph; that is why
# Apache-2.0 WITH LLVM-exception is needed below. The notice file (U10) uses normal dependencies only.
targets = ["aarch64-linux-android", "x86_64-linux-android"]
exclude-dev = true

[licenses]
version = 2
confidence-threshold = 0.9
# Only licenses that crates in the graph above use. Add one when a new dependency needs it, and
# keep it out of the list if the app cannot take it.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception", # ar_archive_writer, build dependency of psm
  "BSD-3-Clause",                   # curve25519-dalek, ed25519-dalek, subtle
  "MPL-2.0",                        # UniFFI runtime and option-ext; file-level copyleft. The notice
                                    # states how to get the source when the app ships (U10)
  "Unicode-3.0",                    # ICU4X crates, unicode-ident
  "Unicode-DFS-2016",               # finl_unicode, wezterm-bidi
  "WTFPL",                          # terminfo
]

[bans]
# Duplicate versions of indirect dependencies are a warning.
multiple-versions = "warn"
# A warning, not an error: the pinned tasty rev's tasty-terminal and tasty-attach-protocol use
# path dependencies without a version inside their git repository and do not set publish = false,
# so allow-wildcard-paths may not cover them. A crates.io crate cannot be published with a
# wildcard dependency, so this only concerns those git dependencies.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
# Only crates.io, plus the two git repositories that Cargo.toml pins by rev.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/zilhak/tasty",
  "https://github.com/zilhak/tasty-network",
]
